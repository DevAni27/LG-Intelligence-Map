name: lg_world_intelligence_map
description: AI-Powered World Intelligence Map for Liquid Galaxy
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7

  # Networking
  dio: ^5.8.0+1

  # Map
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # SSH & KML
  dartssh2: ^2.10.0
  xml: ^6.5.0

  # UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  

flutter:
  uses-material-design: true
